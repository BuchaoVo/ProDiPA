  structure_pass_plddt70_pae15_rate_min: 0.48
  structure_pass_reference_range: [0.48, 0.63]
  low_complexity_risk: significantly_below_sol_v2_0.629
  noncanonical_requests: 0
  comparison_protocol: canonical_legacy_bpe_mask_and_512_aa_safety_cap
complexity_gate:
  min_global_entropy_bits: 2.5
  max_single_residue_fraction: 0.35
  max_homopolymer_run: 12
  max_low_complexity_window_fraction: 0.25
  min_unique_residues: 8
  window_aa: 32
  window_entropy_bits: 2.5
  window_max_single_residue_fraction: 0.5
