  validation: validation_1000_complete.tsv.gz
thresholds:
  sol_min: 0.70
  fold_plddt_100_min: 70.0
  fold_mean_pae_max: 15.0
length_bins_aa:
  - [50, 149]
  - [150, 249]
  - [250, 349]
  - [350, 512]
target_quotas:
