  mmseqs_min_sequence_identity: 0.30
  mmseqs_bidirectional_coverage: 0.80
  explicit_fragment_annotations_excluded: true
  complete_group_assigned_to_one_split_only: true
  opposite_split_cross_attribute_homology_allowed: false
  same_split_cross_attribute_homology_allowed: true
  direct_pairwise_all_attribute_cross_split_audit: true
