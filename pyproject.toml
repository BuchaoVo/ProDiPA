[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "prodipa"
version = "0.1.0"
description = "Budget-aware selective refresh for multi-objective protein sequence design"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = ["numpy>=1.24,<3"]

[project.optional-dependencies]
dev = ["pytest>=7,<10"]
evaluation = ["moocore==0.3.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["src"]

[tool.hatch.build.targets.wheel]
packages = ["src/prodipa"]
