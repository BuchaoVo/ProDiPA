student:
  backbone_path: __PRODIPA_MODELS__/ProLLaMA
  lora:
    r: 8
    alpha: 16
    dropout: 0.1
    target_modules:
      - q_proj
      - v_proj
      - k_proj
      - o_proj
      - gate_proj
      - down_proj
      - up_proj

teachers:
  backbone_path: __PRODIPA_MODELS__/ProLLaMA
  adapters:
    - name: fold
      adapter_path: __PRODIPA_ROOT__/outputs/conditional/prollama/fold/final_adapter
      weight: 0.3333333333
      temperature: 0.7
    - name: sol
      adapter_path: __PRODIPA_ROOT__/outputs/conditional/prollama/sol/final_adapter
      weight: 0.3333333333
      temperature: 0.7
    - name: thermo
      adapter_path: __PRODIPA_ROOT__/outputs/conditional/prollama/thermo/final_adapter
      weight: 0.3333333334
      temperature: 0.7

prompt:
  instruction: "[Generate by superfamily]"
  input: "Superfamily=<Tetratricopeptide-like helical domain superfamily>"
  sequence_regex: "Seq=<([^>]*)>"

distill:
  loss_type: jsd
  fusion_rule: poe
  beta: 0.5
  top_k_loss: 0
  use_z_t: false
  use_entropy_rule: false
  entropy_alpha: 0.0
  log_teacher_entropy: false
  use_wi_entropy: false
  use_wi_distance: false
  wi_entropy_tau: 1.0
  wi_distance_beta: 0.9
  wi_distance_tau: 1.0
  prodipa:
    debug_teacher_diff: false
    debug_teacher_diff_steps: 5

generation:
  num_train_samples: 128
  max_new_tokens: 256
  student_temperature: 1.0
  use_curriculum_tem: false
  curriculum_tem_start: 0.7
  repetition_penalty: 1.2
  top_p: 0.9
  top_k: 200
  save_generations: true
  generation_save_steps: 100
